[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "quadloom_native"
description = "Native backend of the QuadLoom Blender extension"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dynamic = ["version"]

[tool.maturin]
module-name = "quadloom_native"
