[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/CloudyTabzy/QuadLoom"
authors = ["CloudyTabzy"]

[workspace.dependencies]
quadloom-core = { path = "crates/quadloom-core" }
glam = "0.34.1"
rayon = "1.12.0"
# Sequential only (no `rayon` feature): deterministic results, and parts already run in parallel.
microlp = "0.6.0"
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
thiserror = "2.0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
tobj = "4.0.5"
stl_io = "0.11.0"
proptest = "1.12.0"
insta = "1.49.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
