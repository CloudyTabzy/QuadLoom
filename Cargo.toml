[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/CloudyTabzy/QuadLoom"
authors = ["CloudyTabzy"]

[workspace.dependencies]
quadloom-core = { path = "crates/quadloom-core" }
glam = "0.34.1"
rayon = "1.12.0"
# Sequential only (no `rayon` feature): deterministic results, and parts already run in parallel.
microlp = "0.6.0"
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
# foldhash-backed SwissTable maps: much faster than std's SipHash on our integer keys,
# plus HashTable for maps whose key can be recomputed from the value.
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
# Inline small vectors (a vertex's fan and ring) so mesh edits don't allocate;
# tinyvec rather than smallvec because it is itself forbid(unsafe_code).
tinyvec = { version = "1.13.3", features = ["alloc", "rustc_1_61"] }
# Portable SIMD with runtime dispatch (SSE2 up to AVX-512, NEON) for the BVH queries.
fearless_simd = "1.1.0"
thiserror = "2.0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
tobj = "4.0.5"
stl_io = "0.11.0"
proptest = "1.12.0"
insta = "1.49.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
